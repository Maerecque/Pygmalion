[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pygmalion-pointcloud"
version = "1.0.1"
description = "Point cloud processing and CityJSON conversion for wharf cellar structures"
requires-python = ">=3.9"
dependencies = [
    "laspy==2.3.0",
    "laszip==0.1.0",
    "lazrs==0.4.5",
    "matplotlib==3.6.0",
    "numpy==1.26.4",
    "open3d==0.19.0",
    "plyfile==0.7.4",
    "pyvista==0.44.1",
    "vtk==9.3.1",
    "scikit-learn==1.5.0",
    "scipy==1.10.0",
    "shapely==2.0.7",
    "tqdm==4.66.3",
    "trimesh==4.4.3",
]

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["Source*"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_strict_optional = true
